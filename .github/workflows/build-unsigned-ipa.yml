name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布 GitHub Release（false = 只构建 IPA 供测试）'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Force refresh KugouPlaybackView.swift
        run: |
          set -e
          python3 - <<'PYEOF'
          import urllib.request
          import json
          import base64
          url = "https://api.github.com/repos/zhangwenwei44/-11/contents/Beans/KugouPlaybackView.swift?ref=main"
          req = urllib.request.Request(url, headers={'User-Agent': 'opencode'})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
          if 'content' not in data:
              print("ERROR: API response:", data)
              raise SystemExit(1)
          content = base64.b64decode(data['content'])
          with open('Beans/KugouPlaybackView.swift', 'wb') as f:
              f.write(content)
          print("Downloaded", len(content), "bytes")
          PYEOF
          head -3 Beans/KugouPlaybackView.swift
          echo "--- Lines 48-52 ---"
          sed -n '48,52p' Beans/KugouPlaybackView.swift

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Resolve build number (推送与发布构建自动递增，测试构建沿用 project.yml 中的值)
        id: bump
        env:
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          python3 - <<'PYEOF'
          import re
          import os
          path = 'project.yml'
          with open(path) as f:
              content = f.read()
          def bump_build(m):
              return 'CURRENT_PROJECT_VERSION: "' + str(int(m.group(1)) + 1) + '"'
          if os.environ.get('GITHUB_EVENT_NAME') == 'push' or os.environ.get('PUBLISH_RELEASE') == 'true':
              content, n2 = re.subn(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', bump_build, content)
          with open(path, 'w') as f:
              f.write(content)
          ver = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', content).group(1)
          build = re.search(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', content).group(1)
          print('::notice title=Version::Building %s (build %s)' % (ver, build))
          with open('version.txt', 'w') as f:
              f.write(ver)
          with open('build.txt', 'w') as f:
              f.write(build)
          PYEOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        shell: bash
        run: |
          VER=$(cat version.txt)
          BUILD=$(cat build.txt)
          echo "Building with MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=$BUILD"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$VER" >> "$GITHUB_ENV"
echo "VERSION_TAG=v$VER" >> "$GITHUB_ENV"
            rm -rf build
            rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
            xcodebuild \
              -project Beans.xcodeproj \
              -scheme Beans \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              MARKETING_VERSION="$VER" \
              CURRENT_PROJECT_VERSION="$BUILD" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee xcodebuild.log

      - name: Commit build errors on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          : > ci-logs/xcodebuild-errors.log
          for f in xcodebuild.log package.log; do
            [ -f "$f" ] || continue
            echo "===== $f =====" >> ci-logs/xcodebuild-errors.log
            grep -E "error:|fatal|No such file|BUILD FAILED|xcodebuild: error|Errors" "$f" >> ci-logs/xcodebuild-errors.log || true
            echo "----- tail of $f -----" >> ci-logs/xcodebuild-errors.log
            tail -n 60 "$f" >> ci-logs/xcodebuild-errors.log || true
          done
          [ -s ci-logs/xcodebuild-errors.log ] || echo "no logs captured" > ci-logs/xcodebuild-errors.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/xcodebuild-errors.log
          git commit -m "ci: capture build errors [skip ci]" || exit 0
          git push

      - name: Verify version in built app
        run: |
          echo "== project.yml =="
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml
          echo "== built Info.plist =="
          plutil -p build/Build/Products/Release-iphoneos/Beans.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion"

      - name: Package IPA
        shell: bash
        run: |
          exec > >(tee package.log) 2>&1
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Beans.app Payload/
          # 使用普通 ZIP，避免将 macOS 资源元数据带入 IPA，提升第三方签名器兼容性。
          zip -qry Beans-unsigned.ipa Payload
          unzip -t Beans-unsigned.ipa
          test -d Payload/Beans.app
          test -f Payload/Beans.app/Info.plist
          test -x Payload/Beans.app/Beans

      - name: Generate install manifest (itms-services)
        run: |
          python3 - <<'PYEOF'
          import re
          ver = open('version.txt').read().strip()
          build = open('build.txt').read().strip()
          tag = 'v' + ver
          yml = open('project.yml', encoding='utf-8').read()
          bid = re.search(r'PRODUCT_BUNDLE_IDENTIFIER:\s*(\S+)', yml).group(1)
          disp = re.search(r'CFBundleDisplayName:\s*(.+)', yml).group(1).strip()
          ipa_url = 'https://github.com/zhangwenwei44/-11/releases/download/%s/Beans-unsigned.ipa' % tag
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0">',
              '<dict>',
              '  <key>items</key>',
              '  <array>',
              '    <dict>',
              '      <key>assets</key>',
              '      <array>',
              '        <dict>',
              '          <key>kind</key>',
              '          <string>software-package</string>',
              '          <key>url</key>',
              '          <string>' + ipa_url + '</string>',
              '        </dict>',
              '      </array>',
              '      <key>metadata</key>',
              '      <dict>',
              '        <key>bundle-identifier</key>',
              '        <string>' + bid + '</string>',
              '        <key>bundle-version</key>',
              '        <string>' + build + '</string>',
              '        <key>kind</key>',
              '        <string>software</string>',
              '        <key>title</key>',
              '        <string>' + disp + '</string>',
              '      </dict>',
              '    </dict>',
              '  </array>',
              '</dict>',
              '</plist>',
          ]
          open('manifest.plist', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PYEOF
          test -s manifest.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beans-unsigned-ipa
          path: Beans-unsigned.ipa

      - name: Build release notes from CHANGELOG
        run: |
          python3 - <<'PYEOF'
          import re
          ver = open('version.txt').read().strip()
          content = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^##\s+' + re.escape(ver) + r'\s*$([\s\S]*?)(?=^##\s|\Z)', content, re.M)
          body = m.group(1).strip() if m else ('版本 ' + ver + ' 的更新内容。')
          body = '# 酷狗播放器 ' + ver + '\n\n' + body + '\n'
          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          print(body)
          PYEOF

      - name: Publish Release
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: 酷狗播放器 ${{ env.VERSION_LABEL }}
          body_path: release_body.md
          files: |
            Beans-unsigned.ipa
            manifest.plist
          update_release_body: true
          update_release_name: true
          update_release_assets: true

      - name: Commit version bump back
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml
          if git diff --cached --quiet; then
            echo "no version change to commit"
          else
            git commit -m "chore: bump build to $(cat build.txt) [skip ci]"
            git push
          fi
